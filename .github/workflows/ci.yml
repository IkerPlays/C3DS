name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Tests de interfaz con Chromium (Playwright): editor, vista previa, guardado, exportación, importador.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  # Genera cada plantilla del editor y la compila de verdad a .3dsx y .cia con devkitARM + tex3ds + makerom + bannertool.
  sample:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [coins, pong, dodge, blank]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-sample.mjs sample --template=${{ matrix.template }}
      - uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.template }}
          path: sample
          include-hidden-files: true

  build-3ds-sample:
    needs: sample
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix:
        template: [coins, pong, dodge, blank]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sample-${{ matrix.template }}
          path: sample
      - name: Instalar makerom y bannertool
        run: |
          set -e
          (command -v wget && command -v unzip) >/dev/null || (apt-get update && apt-get install -y wget unzip)
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          echo "c6f8aafba8f1cdb403929719c95173cada707cd9ceacfa2bec5118f8f96c6f8a  makerom-v0.18-ubuntu_x86_64.zip" | sha256sum -c -
          echo "69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip" | sha256sum -c -
          unzip -o makerom-v0.18-ubuntu_x86_64.zip makerom -d /usr/local/bin
          unzip -oj bannertool.zip linux-x86_64/bannertool -d /usr/local/bin
          chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool
      - name: make (.3dsx)
        working-directory: sample
        run: make
      - name: make cia (.cia)
        working-directory: sample
        run: make cia
      - run: ls -la sample/*.3dsx sample/*.cia
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.template }}
          path: |
            sample/*.3dsx
            sample/*.cia

  # Valida de verdad el destino Windows: genera el juego HTML5 de ejemplo y lo empaqueta como .exe con Tauri.
  windows-game-sample:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar juego HTML5 de ejemplo
        shell: bash
        run: node scripts/gen-sample.mjs sample-html --html5
      - name: Empaquetar .exe
        shell: bash
        run: bash scripts/build-tauri-game.sh sample-html mi-primer-juego result
      - shell: bash
        run: ls -la result/*.exe

  # Valida los destinos macOS y Linux del editor: el juego HTML5 de ejemplo empaquetado con Tauri.
  desktop-game-sample:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos, runner: macos-latest }
          - { target: linux, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar juego HTML5 de ejemplo
        run: node scripts/gen-sample.mjs sample-html --html5
      - name: Empaquetar
        run: bash scripts/build-tauri-game.sh sample-html mi-primer-juego result ${{ matrix.target }}
      - run: ls -la result
