# Release GLOBAL: push de un tag vX.Y.Z -> compila todas las plataformas y publica una release con todo + changelog.
name: Release (global)
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.i.outputs.version }}
      prerelease: ${{ steps.i.outputs.prerelease }}
      matrix: ${{ steps.i.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: i
        run: node scripts/release-info.mjs "$GITHUB_REF_NAME" --notes release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: info
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.info.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.info.outputs.version }}

  publish:
    needs: [info, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: C3DS-*
          merge-multiple: true
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.info.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release-files && sha256sum -- * > /tmp/SHA256SUMS.txt && mv /tmp/SHA256SUMS.txt .)
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" release-files/* \
               --repo "$REPO" --verify-tag --title "C3DS $TAG" --notes-file release-notes.md "${flags[@]}"; then break; fi
            [ "$attempt" = 4 ] && { echo "::error::No se pudo crear la release"; exit 1; }
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && break
            sleep $((attempt * 20))
          done
