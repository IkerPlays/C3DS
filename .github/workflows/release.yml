# Release GLOBAL: push de un tag vX.Y.Z -> compila todas las plataformas y publica una release con todo + changelog.
name: Release (global)
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar, p. ej. v0.1.0 (se crea sobre main si no existe)'
        required: true
permissions:
  contents: read
jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.i.outputs.version }}
      prerelease: ${{ steps.i.outputs.prerelease }}
      matrix: ${{ steps.i.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: i
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          # Con workflow_dispatch solo se publica desde main.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Lanza el workflow desde la rama main"; exit 1; fi
          node scripts/release-info.mjs "$TAG" --notes release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: info
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.info.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.info.outputs.version }}

  publish:
    needs: [info, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: C3DS-*
          merge-multiple: true
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ needs.info.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd release-files && sha256sum -- * > /tmp/SHA256SUMS.txt && mv /tmp/SHA256SUMS.txt .)
          tagflag=(--verify-tag)
          [ "$EVENT" = workflow_dispatch ] && tagflag=(--target "$GITHUB_SHA")
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" release-files/* \
               --repo "$REPO" "${tagflag[@]}" --title "C3DS $TAG" --notes-file release-notes.md "${flags[@]}"; then break; fi
            [ "$attempt" = 4 ] && { echo "::error::No se pudo crear la release"; exit 1; }
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && break
            sleep $((attempt * 20))
          done
