# DEVBUILDS: cambios pequeños en main -> UNA pre-release "dev-<n>" con los archivos de TODAS las plataformas.
name: Devbuild
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - 'windows/**'
      - 'macos/**'
      - 'linux/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/_build.yml'
      - '.github/workflows/devbuild.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devbuild
  cancel-in-progress: false
env:
  KEEP: 10
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: p
        run: node scripts/plan-devbuild.mjs --after "$GITHUB_SHA" --run "$GITHUB_RUN_NUMBER"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    timeout-minutes: 40
    needs: [plan, build]
    # Publica aunque falle alguna plataforma (fail-fast desactivado), con lo que se haya compilado.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: C3DS-*
          merge-multiple: true
          path: release-files
      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_RESULT: ${{ needs.build.result }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag="dev-${GITHUB_RUN_NUMBER}"
          if [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="-10 $GITHUB_SHA"
          fi
          {
            echo "Devbuild \`$VERSION\` (no estable) con todas las plataformas."
            [ "$BUILD_RESULT" != "success" ] && echo && echo "> ⚠️ Alguna plataforma falló: faltan archivos en esta build."
            echo; echo "Commit: $GITHUB_SHA"; echo; echo "### Cambios"
            git log --no-merges --pretty='- %s (%h)' $range | head -30
          } > notes.md
          (cd release-files && sha256sum -- * > /tmp/SHA256SUMS.txt && mv /tmp/SHA256SUMS.txt .)
          # GitHub rechaza con 403 "Resource not accessible by integration" crear una release poco después de otra
          # (los fallos de dev-4, dev-7 y dev-9 ocurrieron a <10 min de la release anterior; el token sí tenía
          # Contents: write). Se espera hasta que pasen GAP segundos desde la última publicación de un devbuild.
          GAP=660
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | test("^dev-[0-9]+$"))] | sort_by(.publishedAt) | reverse | .[0].publishedAt // empty')
          if [ -n "$last" ]; then
            elapsed=$(( $(date +%s) - $(date -d "$last" +%s) ))
            if [ "$elapsed" -lt "$GAP" ]; then
              echo "Última release de devbuild hace ${elapsed}s: se espera $((GAP - elapsed))s para evitar el límite de GitHub"
              sleep $((GAP - elapsed))
            fi
          fi
          ok=0
          for attempt in 1 2 3; do
            if gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --prerelease --latest=false --title "Devbuild #$GITHUB_RUN_NUMBER ($VERSION)" --notes-file notes.md; then ok=1; break; fi
            echo "::warning::Intento $attempt de crear $tag falló"
            # Si la release llegó a crearse a pesar del error, se da por buena.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { ok=1; break; }
            sleep $((attempt * 90))
          done
          [ "$ok" = 1 ] || { echo "::error::No se pudo crear la release $tag"; exit 1; }
          # Conserva solo las KEEP más recientes.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"^dev-[0-9]+\$\"))] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
            while read -r old; do [ -n "$old" ] && gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
