# DEVBUILDS: cambios pequeños en main -> UNA pre-release "dev-<n>" con los archivos de TODAS las plataformas.
name: Devbuild
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - 'windows/**'
      - 'macos/**'
      - 'linux/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/_build.yml'
      - '.github/workflows/devbuild.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devbuild
  cancel-in-progress: false
env:
  KEEP: 10
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: p
        run: node scripts/plan-devbuild.mjs --after "$GITHUB_SHA" --run "$GITHUB_RUN_NUMBER"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, build]
    # Publica aunque falle alguna plataforma (fail-fast desactivado), con lo que se haya compilado.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: c3ds-*
          merge-multiple: true
          path: assets
      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_RESULT: ${{ needs.build.result }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag="dev-${GITHUB_RUN_NUMBER}"
          if [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="-10 $GITHUB_SHA"
          fi
          {
            echo "Devbuild \`$VERSION\` (no estable) con todas las plataformas."
            [ "$BUILD_RESULT" != "success" ] && echo && echo "> ⚠️ Alguna plataforma falló: faltan archivos en esta build."
            echo; echo "Commit: $GITHUB_SHA"; echo; echo "### Cambios"
            git log --no-merges --pretty='- %s (%h)' $range | head -30
          } > notes.md
          (cd assets && sha256sum -- * > /tmp/SHA256SUMS.txt && mv /tmp/SHA256SUMS.txt .)
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Devbuild #$GITHUB_RUN_NUMBER ($VERSION)" --notes-file notes.md
          # Conserva solo las KEEP más recientes.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"^dev-[0-9]+\$\"))] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
            while read -r old; do [ -n "$old" ] && gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
