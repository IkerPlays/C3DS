<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C3DS – montaje de plantillas</title>
<style>
  :root{--acc:#ff4d6d;--gold:#ffd400;--bg:#080b18}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  #bg{position:fixed;inset:0;background:radial-gradient(60% 70% at 28% 50%,#243566 0%,transparent 70%),radial-gradient(40% 40% at 90% 90%,rgba(255,77,109,.3),transparent 70%),radial-gradient(35% 40% at 80% 10%,rgba(41,173,255,.22),transparent 70%),var(--bg)}
  #grid{position:fixed;inset:-100px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px;transform:perspective(700px) rotateX(62deg) translateY(-12%) scale(2.4);transform-origin:50% 100%;animation:grid 8s linear infinite;mask-image:linear-gradient(transparent,#000 40%,#000)}
  @keyframes grid{to{background-position:0 64px}}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:90px;padding:0 120px}

  /* consola */
  .console{position:relative;flex:none;width:720px;padding:26px 30px 34px;border-radius:44px;background:linear-gradient(160deg,#f3f5fb,#c5cbe0 60%,#aab2d4);box-shadow:0 50px 120px rgba(0,0,0,.6),inset 0 -8px 0 #8f99c4,inset 0 4px 0 #fff;transform:perspective(2000px) rotateY(9deg) rotateX(2deg);animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:perspective(2000px) rotateY(7deg) rotateX(1deg) translateY(-12px)}}
  .scr{background:#0b0e1a;border-radius:16px;padding:12px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35);display:flex;justify-content:center}
  .scr.bottom{margin:0 auto;width:540px}
  .hinge{height:22px;margin:12px 20px;border-radius:10px;background:linear-gradient(#a5aecf,#dfe3f2 60%,#b7bfdc);box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
  canvas.game{display:block;image-rendering:pixelated;border-radius:4px}
  #top{width:640px;height:384px}
  #bottom{width:512px;height:384px}
  .led{position:absolute;right:46px;bottom:12px;width:10px;height:10px;border-radius:50%;background:#3ddc97;box-shadow:0 0 12px #3ddc97}

  /* texto */
  .info{flex:1;max-width:820px}
  .kick{display:inline-block;font-weight:800;font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,#ff004d,#ff7a18);padding:10px 20px;border-radius:99px;box-shadow:0 10px 28px rgba(255,0,77,.4)}
  .name{font-size:112px;font-weight:900;line-height:1;margin:26px 0 18px;letter-spacing:-.02em}
  .desc{font-size:40px;line-height:1.3;color:#d5dbf7;font-weight:600;max-width:760px}
  .chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
  .chip{font-size:28px;font-weight:800;padding:10px 22px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff}
  .chip.k{background:rgba(255,212,0,.16);border-color:rgba(255,212,0,.5);color:var(--gold)}
  .count{position:fixed;right:90px;bottom:60px;font-size:34px;font-weight:800;color:#8e9acb;letter-spacing:.2em}
  .count b{color:#fff}
  .swap .info>*,.swap .console .scr{animation:in .38s cubic-bezier(.2,.9,.2,1) both}
  .swap .info .name{animation-delay:.04s}.swap .info .desc{animation-delay:.08s}.swap .info .chips{animation-delay:.12s}
  @keyframes in{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
  html:has(body.still),body.still{background:transparent}
  body.still #bg,body.still #grid,body.still .info,body.still .count,body.still .flash{display:none}
  body.still .stage{padding:0;gap:0}
  body.still .console{animation:none;transform:perspective(2000px) rotateY(-9deg) rotateX(3deg) rotate(2deg)}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  .swap .flash{animation:flash .3s ease-out}
  @keyframes flash{from{opacity:.32}to{opacity:0}}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>
<div class="stage" id="stage">
  <div class="console">
    <div class="scr top"><canvas class="game" id="top" width="400" height="240"></canvas></div>
    <div class="hinge"></div>
    <div class="scr bottom"><canvas class="game" id="bottom" width="320" height="240"></canvas></div>
    <span class="led"></span>
  </div>
  <div class="info">
    <span class="kick" id="kick">Plantilla</span>
    <div class="name" id="name"></div>
    <div class="desc" id="desc"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div class="count" id="count"></div>
<div class="flash"></div>

<script type="module">
  import { TEMPLATES, LESSONS } from '/js/templates.js';
  import { Game, render } from '/js/runtime.js';

  const tpl = (id) => TEMPLATES.find((t) => t.id === id).make;
  const find = (g, name) => g.objs.find((o) => o.name === name);
  const dir = (held, a, b, tol = 4) => { // mueve a hacia b con D-Pad
    if (b.x > a.x + tol) held.add('RIGHT'); else if (b.x < a.x - tol) held.add('LEFT');
    if (b.y > a.y + tol) held.add('DOWN'); else if (b.y < a.y - tol) held.add('UP');
  };
  const center = (o) => ({ x: o.x + o.w / 2, y: o.y + o.h / 2 });

  // Cada "bot" juega solo, para que el montaje enseñe cada plantilla en acción.
  const SLOTS = [
    { id: 'coins', make: tpl('coins'), start: 1, name: 'Recoger monedas', kick: 'Plantilla 1', desc: 'Sprites animados, sonido y reglas visuales.', chips: ['D-Pad', 'Sprites', 'Sonido'], speed: 1,
      bot: (g) => { const h = new Set(); const p = find(g, 'Jugador'); const c = find(g, 'Moneda'); if (p && c) dir(h, center(p), center(c), 3); return { held: h }; } },
    { id: 'pong', make: tpl('pong'), start: 0, name: 'Pong', kick: 'Plantilla 2', desc: 'Rebotes, velocidad y marcador.', chips: ['Física', 'Bordes', 'Variables'], speed: 1,
      bot: (g) => { const h = new Set(); const p = find(g, 'Pala'); const b = find(g, 'Pelota'); if (p && b) { if (b.y + 5 > p.y + 25 + 5) h.add('DOWN'); else if (b.y + 5 < p.y + 25 - 5) h.add('UP'); } return { held: h }; } },
    { id: 'dodge', make: tpl('dodge'), start: 0, name: 'Esquivar', kick: 'Plantilla 3', desc: 'Bloques que caen y pantalla final.', chips: ['Escenas', 'Colisiones', 'Reintentar'], speed: 1,
      bot: (g, f) => { const h = new Set(); const p = find(g, 'Jugador'); if (p) { const tx = 195 + 45 * Math.sin(f / 40); if (tx > p.x + 20 + 4) h.add('RIGHT'); else if (tx < p.x + 20 - 4) h.add('LEFT'); } return { held: h }; } },
    { id: 'arcade', make: tpl('arcade'), start: 0, name: 'Arcade', kick: 'Plantilla 4', desc: 'Circle Pad, stylus y música en bucle.', chips: ['Circle Pad', 'Stylus', 'Música'], speed: 1,
      bot: (g, f) => { const p = find(g, 'Nave'); const c = find(g, 'Moneda'); const cur = find(g, 'Cursor'); let circle = { x: 0, y: 0 };
        if (p && c) { const dx = c.x + 16 - (p.x + 14); const dy = c.y + 16 - (p.y + 14); const m = Math.hypot(dx, dy) || 1; circle = { x: dx / m, y: dy / m }; }
        const t = f / 30; return { held: new Set(), circle, touch: cur ? { x: 160 + 110 * Math.cos(t), y: 120 + 80 * Math.sin(t * 1.3) } : null }; } },
    { id: 'runner', make: tpl('runner'), start: 0, name: 'Corredor', kick: 'Plantilla 5', desc: 'Gravedad, saltos y récord guardado.', chips: ['Gravedad', 'Saltos', 'Guardado'], speed: 1,
      bot: (g) => { const d = new Set(); const h = new Set(); const p = find(g, 'Jugador'); const o = find(g, 'Obstáculo'); if (p && o && o.x - (p.x + p.w) < 70 && o.x > p.x) d.add('A'); return { down: d, held: h }; } },
    { id: 'topos', make: tpl('topos'), start: 0, name: 'Topos', kick: 'Plantilla 6', desc: 'Pantalla táctil, temporizador y cuenta atrás.', chips: ['Táctil', 'Temporizador', 'Azar'], speed: 1,
      bot: (g, f) => { const m = find(g, 'Topo'); if (m && f % 22 === 0) return { touch: { x: m.x + 22, y: m.y + 22 }, touchDown: true }; return {}; } },
    { id: 'maze', make: tpl('maze'), start: 0, name: 'Laberinto', kick: 'Plantilla 7', desc: 'Objetos sólidos: los muros bloquean el paso.', chips: ['Sólidos', 'Colisiones', 'Meta'], speed: 5,
      bot: (() => { const W = [[100, 200], [100, 56], [182, 56], [182, 172], [282, 172], [282, 56], [344, 56], [352, 204]]; let i = 0;
        return (g) => { const h = new Set(); const p = find(g, 'Jugador'); if (!p) return { held: h }; const t = { x: W[i][0], y: W[i][1] }; if (Math.abs(p.x - t.x) < 4 && Math.abs(p.y - t.y) < 4 && i < W.length - 1) i++; dir(h, p, W[i], 2); return { held: h }; }; })() },
    { id: 'l2', make: LESSONS.find((l) => l.id === 'l2').make, start: 0, name: 'Lecciones guiadas', kick: 'Aprende', desc: '5 mini-proyectos para entender cada idea.', chips: ['Mover', 'Colisiones', 'Variables', 'Escenas', 'Sonido'], speed: 1,
      bot: (g) => { const h = new Set(); const p = find(g, 'Jugador'); const c = find(g, 'Moneda'); if (p && c) dir(h, center(p), center(c), 3); return { held: h }; } },
  ];

  const top = document.getElementById('top'); const bottom = document.getElementById('bottom');
  const ctxs = { top: top.getContext('2d'), bottom: bottom.getContext('2d') };
  const $ = (id) => document.getElementById(id);

  let cur = null;
  const load = (i) => {
    const s = SLOTS[i]; const project = s.make();
    if (project.scenes[s.start]) project.startScene = project.scenes[s.start].id;
    const g = new Game(project, { rng: Math.random });
    const images = new Map();
    for (const a of project.assets.images) { const im = new Image(); im.src = project.blobs[a.id]; images.set(a.id, im); }
    cur = { s, g, images, frame: 0 };
    $('kick').textContent = s.kick; $('name').textContent = s.name; $('desc').textContent = s.desc;
    $('chips').replaceChildren(...s.chips.map((c, k) => Object.assign(document.createElement('span'), { className: 'chip' + (k === 0 ? ' k' : ''), textContent: c })));
    $('count').innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${String(SLOTS.length).padStart(2, '0')}`;
    document.body.classList.remove('swap'); void document.body.offsetWidth; document.body.classList.add('swap');
    // Pre-calentamiento: el juego ya está en marcha al aparecer.
    for (let k = 0; k < (s.id === 'maze' ? 0 : 90); k++) tick();
  };

  const tick = () => {
    const { s, g } = cur; cur.frame++;
    const inp = s.bot(g, cur.frame) || {};
    g.step({ down: inp.down || new Set(), held: inp.held || new Set(), touch: inp.touch || null, touchDown: !!inp.touchDown, circle: inp.circle || { x: 0, y: 0 } });
  };

  let last = performance.now(); let acc = 0; let running = false;
  const loop = (now) => {
    requestAnimationFrame(loop);
    if (!cur) return;
    acc += Math.min(100, now - last); last = now;
    if (running) while (acc >= 1000 / 60) { acc -= 1000 / 60; for (let k = 0; k < cur.s.speed; k++) tick(); }
    else acc = 0;
    render(cur.g, ctxs, cur.images);
  };

  const still = new URLSearchParams(location.search).get('still');
  if (still != null) { document.body.classList.add('still'); load(Number(still)); running = true; for (let k = 0; k < 90; k++) tick(); }
  else load(0);
  requestAnimationFrame(loop);
  // El director arranca el montaje cuando la grabación está lista.
  window.__go = (per = 1000) => {
    running = true; let i = 0; load(0);
    const t = setInterval(() => { i++; if (i >= SLOTS.length) { clearInterval(t); return; } load(i); }, per);
  };
  document.fonts?.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
