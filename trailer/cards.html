<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C3DS – tarjetas del tráiler</title>
<style>
  :root{--acc:#ff4d6d;--acc2:#ff7a93;--gold:#ffd400;--bg:#080b18}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  #bg{position:fixed;inset:0;background:
    radial-gradient(70% 60% at 50% 40%,#1d2b53 0%,transparent 70%),
    radial-gradient(40% 40% at 85% 90%,rgba(255,77,109,.28),transparent 70%),
    radial-gradient(40% 40% at 10% 15%,rgba(41,173,255,.22),transparent 70%),var(--bg)}
  #grid{position:fixed;inset:-100px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px;transform:perspective(700px) rotateX(62deg) translateY(-12%) scale(2.4);transform-origin:50% 100%;animation:grid 8s linear infinite;mask-image:linear-gradient(transparent,#000 40%,#000)}
  @keyframes grid{to{background-position:0 64px}}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .scene{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
  body[data-card=intro] #intro,body[data-card=outro] #outro,body[data-card=platforms] #platforms,body[data-card=thumb] #thumb{display:flex}

  .logo{width:210px;height:210px;filter:drop-shadow(0 20px 60px rgba(255,77,109,.55))}
  .title{font-weight:900;letter-spacing:.06em;display:flex;gap:.04em;line-height:1}
  .title span{display:inline-block;opacity:0;transform:translateY(60px) scale(.9);animation:rise .7s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .pop{opacity:0;transform:scale(.4) rotate(-12deg);animation:pop .8s cubic-bezier(.2,1.4,.3,1) forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .fade{opacity:0;transform:translateY(24px);animation:rise .8s cubic-bezier(.2,.9,.2,1) forwards}
  .shine{background:linear-gradient(100deg,#fff 40%,var(--gold) 50%,#fff 60%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.6s ease-in-out 1.2s both}
  @keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
  .grad{background:linear-gradient(90deg,var(--acc),#ff9a3d);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* intro */
  #intro .logo{animation:pop .9s cubic-bezier(.2,1.4,.3,1) .1s both}
  #intro .title{font-size:200px;margin-top:20px}
  #intro .tag{font-size:56px;font-weight:700;margin-top:26px;color:#e8ecff}
  #intro .sub{font-size:32px;font-weight:600;margin-top:18px;letter-spacing:.18em;text-transform:uppercase;color:#a8b3e0}

  /* plataformas */
  #platforms h2{font-size:84px;font-weight:900;margin:0 0 56px;letter-spacing:-.01em}
  .tiles{display:grid;grid-template-columns:repeat(4,330px);gap:26px}
  .tile{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:28px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(40px) scale(.92);animation:rise .6s cubic-bezier(.2,1.2,.3,1) forwards;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .tile svg{width:92px;height:92px;color:#fff}
  .tile b{font-size:36px;font-weight:800}
  .tile small{font-size:23px;color:#aeb8e6;font-weight:600;letter-spacing:.04em}
  .tile.hero{background:linear-gradient(160deg,rgba(255,77,109,.45),rgba(255,154,61,.25));border-color:rgba(255,255,255,.3)}
  .checks{display:flex;gap:44px;margin-top:50px;font-size:38px;font-weight:800}
  .checks span{opacity:0;animation:rise .6s ease forwards;display:flex;gap:12px;align-items:center}
  .checks i{font-style:normal;color:#3ddc97}

  /* outro */
  #outro .logo{width:170px;height:170px;animation:pop .8s cubic-bezier(.2,1.4,.3,1) both}
  #outro .title{font-size:170px;margin-top:10px}
  #outro .cta{font-size:56px;font-weight:800;margin-top:22px}
  #outro .url{margin-top:30px;font-size:42px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:16px 40px;border-radius:99px;letter-spacing:.02em}
  #outro .small{margin-top:28px;font-size:28px;color:#a8b3e0;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  #outro{animation:out .7s ease 5.3s forwards}
  @keyframes out{to{opacity:0}}

  /* miniatura */
  #thumb .logo{width:150px;height:150px;position:absolute;top:60px;left:70px}
  #thumb h1{font-size:150px;line-height:.95;margin:0;font-weight:900;text-shadow:0 10px 40px rgba(0,0,0,.5)}
  #thumb p{font-size:50px;font-weight:800;margin:24px 0 0;color:var(--gold)}
  #thumb .wrap{position:absolute;left:80px;bottom:80px;text-align:left}
  #thumb .shot{position:absolute;right:20px;top:60px;width:900px;height:960px;border:0;background:transparent;color-scheme:normal}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div><canvas id="stars"></canvas>

<section class="scene" id="intro">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff4d6d"/><path d="M9 9h14M9 16h12M9 23h14M21 9v14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <div class="title shine" id="t-intro"></div>
  <div class="tag fade" style="animation-delay:1.5s" data-k="introTag">Crea juegos para tu Nintendo 3DS</div>
  <div class="sub fade" style="animation-delay:2.4s" data-k="introSub">Visual · Sin código · En tu navegador</div>
</section>

<section class="scene" id="platforms">
  <h2 class="fade"><span class="grad" data-k="h2a">Un proyecto.</span> <span data-k="h2b">Todas las plataformas.</span></h2>
  <div class="tiles" id="tiles"></div>
  <div class="checks">
    <span style="animation-delay:5.2s"><i>✔</i> <b data-k="c1">Gratis</b></span>
    <span style="animation-delay:5.7s"><i>✔</i> <b data-k="c2">Código abierto</b></span>
    <span style="animation-delay:6.2s"><i>✔</i> <b data-k="c3">Sin cuenta</b></span>
  </div>
</section>

<section class="scene" id="outro">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff4d6d"/><path d="M9 9h14M9 16h12M9 23h14M21 9v14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <div class="title shine" id="t-outro"></div>
  <div class="cta fade" style="animation-delay:.9s"><span data-k="ctaA">Crea tu primer juego de</span> <span class="grad">3DS</span> <span data-k="ctaB">hoy</span></div>
  <div class="url fade" style="animation-delay:1.7s">github.com/IkerPlays/C3DS</div>
  <div class="small fade" style="animation-delay:2.4s" data-k="small">Gratis · Código abierto</div>
</section>

<section class="scene" id="thumb">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff4d6d"/><path d="M9 9h14M9 16h12M9 23h14M21 9v14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <iframe class="shot" src="/trailer/montage.html?still=0&clean=1" allowtransparency="true"></iframe>
  <div class="wrap"><h1><span data-k="th1">Crea juegos</span><br><span data-k="th2">para tu</span> <span class="grad">3DS</span></h1><p data-k="thp">Sin escribir código · Gratis</p></div>
</section>

<script type="module">
  import { iconSvg } from '/js/icons.js';
  const card = (location.hash || '#intro').slice(1);
  const EN = new URLSearchParams(location.search).get('lang') === 'en';
  const EN_TXT = {
    introTag: 'Make games for your Nintendo 3DS', introSub: 'Visual · No code · In your browser',
    h2a: 'One project.', h2b: 'Every platform.', c1: 'Free', c2: 'Open source', c3: 'No account',
    ctaA: 'Make your first', ctaB: 'game today', small: 'Free · Open source',
    th1: 'Make games', th2: 'for your', thp: 'No coding needed · Free',
  };
  if (EN) { document.documentElement.lang = 'en'; document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = EN_TXT[el.dataset.k]; }); }
  document.body.dataset.card = card;

  const word = (id, text, step = 0.09, base = 0.5) => {
    const el = document.getElementById(id);
    [...text].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = `${base + i * step}s`; el.append(s); });
  };
  word('t-intro', 'C3DS');
  word('t-outro', 'C3DS', 0.08, 0.35);

  // 3DS dibujada a mano (consola abierta con dos pantallas)
  const ds = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="16" height="8.2" rx="2"/><rect x="4" y="12.5" width="16" height="9" rx="2"/><rect x="7" y="4.5" width="10" height="4.2" rx=".6"/><rect x="8" y="14.4" width="8" height="3.6" rx=".6"/><circle cx="6.2" cy="19.6" r=".6" fill="currentColor"/><circle cx="17.8" cy="19.6" r=".6" fill="currentColor"/></svg>`;
  const tiles = [
    ['3DS', 'Nintendo 3DS', '.3dsx · .cia', ds, true],
    ['windows', 'Windows', '.exe', null],
    ['macos', 'macOS', '.dmg', null],
    ['linux', 'Linux', '.AppImage · .deb', null],
    ['android', 'Android', '.apk', null],
    ['ios', 'iOS', '.ipa', null],
    ['web', 'HTML5', EN ? 'Browser · itch.io' : 'Navegador · itch.io', null],
    ['import', 'Godot · Unity', EN ? 'Import your scenes' : 'Importa tus escenas', null],
  ];
  const host = document.getElementById('tiles');
  tiles.forEach(([key, name, ext, svg, hero], i) => {
    const t = document.createElement('div'); t.className = 'tile' + (hero ? ' hero' : ''); t.style.animationDelay = `${0.7 + i * 0.5}s`;
    const ic = svg ? svg : iconSvg(key === 'import' ? 'package' : key, 92);
    t.innerHTML = `${ic}<b>${name}</b><small>${ext}</small>`;
    host.append(t);
  });

  // Estrellas / píxeles flotantes
  const cv = document.getElementById('stars'); const c = cv.getContext('2d');
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener('resize', fit);
  const colors = ['#ff4d6d', '#ffd400', '#29adff', '#3ddc97', '#ffffff'];
  const P = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: 3 + Math.random() * 9, v: 0.02 + Math.random() * 0.06, c: colors[(Math.random() * colors.length) | 0], a: 0.25 + Math.random() * 0.5, r: Math.random() * 6 }));
  let t0 = performance.now();
  const draw = (now) => {
    const dt = (now - t0) / 1000; t0 = now;
    c.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) {
      p.y -= p.v * dt; if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
      c.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(now / 500 + p.r));
      c.fillStyle = p.c; c.fillRect(p.x * cv.width, p.y * cv.height, p.s, p.s);
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  document.fonts?.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
